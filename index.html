<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login to Continue</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    background: #344454;
    color: #4b5560;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  .page {
    width: min(100%, 760px);
    padding: 58px 8px 0;
  }

  h1 {
    margin: 0 0 28px;
    text-align: center;
    color: #f4f4f4;
    font-size: clamp(38px, 7vw, 58px);
    font-weight: 400;
    letter-spacing: -1px;
  }

  .card {
    background: #fff;
    border-radius: 15px;
    padding: 54px 48px 38px;
    box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }

  .logo {
    display: block;
    width: 245px;
    height: 370px;
    object-fit: cover;
    object-position: center top;
    margin: 0 auto 25px;
  }

  label {
    display: block;
    margin: 0 0 13px;
    font-size: 20px;
    font-weight: 400;
    color: #4b5560;
  }

  input {
    width: 100%;
    height: 94px;
    border: 3px solid #cbd1d7;
    border-radius: 7px;
    padding: 0 18px;
    font-size: 22px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }

  input:focus {
    border-color: #4d8bea;
    box-shadow: 0 0 0 2px rgba(77,139,234,.12);
  }

  .field {
    margin-bottom: 48px;
  }

  button {
    width: 100%;
    height: 106px;
    border: 0;
    border-radius: 7px;
    background: #3f80ed;
    color: white;
    font-size: 25px;
    font-weight: 400;
    cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
  }

  button:hover { background: #3475df; }
  button:active { transform: translateY(1px); }

  .forgot {
    display: block;
    margin-top: 48px;
    text-align: center;
    color: #69727a;
    text-decoration: none;
    font-size: 21px;
  }

  .forgot:hover { text-decoration: underline; }

  footer {
    color: #8c949c;
    font-size: 19px;
    margin: 36px 0 28px;
    text-align: center;
  }

  @media (max-width: 600px) {
    .page { padding-top: 42px; }
    .card { padding: 42px 28px 34px; }
    .logo { width: 210px; height: 315px; }
    input { height: 76px; }
    button { height: 82px; }
    .field { margin-bottom: 38px; }
  }
</style>
</head>
