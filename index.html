<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login to Continue</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    background: #344454;
    color: #4b5560;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  .page {
    width: min(100%, 520px);
    padding: 38px 8px 0;
  }

  h1 {
    margin: 0 0 28px;
    text-align: center;
    color: #f4f4f4;
    font-size: clamp(30px, 6vw, 42px);
    font-weight: 400;
    letter-spacing: -1px;
  }

  .card {
    background: #fff;
    border-radius: 15px;
    padding: 34px 30px 28px;
    box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }

  .logo {
    display: block;
    width: 190px;
    height: 265px;
    object-fit: cover;
    object-position: center top;
    margin: 0 auto 25px;
  }

  label {
    display: block;
    margin: 0 0 13px;
    font-size: 14px;
    font-weight: 400;
    color: #4b5560;
  }

  input {
    width: 100%;
    height: 58px;
    border: 3px solid #cbd1d7;
    border-radius: 7px;
    padding: 0 18px;
    font-size: 16px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }

  input:focus {
    border-color: #4d8bea;
    box-shadow: 0 0 0 2px rgba(77,139,234,.12);
  }

  .field {
    margin-bottom: 28px;
  }

  button {
    width: 100%;
    height: 64px;
    border: 0;
    border-radius: 7px;
    background: #3f80ed;
    color: white;
    font-size: 18px;
    font-weight: 400;
    cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
  }

  button:hover { background: #3475df; }
  button:active { transform: translateY(1px); }

  .forgot {
    display: block;
    margin-top: 30px;
    text-align: center;
    color: #69727a;
    text-decoration: none;
    font-size: 15px;
  }

  .forgot:hover { text-decoration: underline; }

  footer {
    color: #8c949c;
    font-size: 13px;
    margin: 36px 0 28px;
    text-align: center;
  }

  @media (max-width: 600px) {
    .page { padding-top: 42px; }
    .card { padding: 42px 28px 34px; }
    .logo { width: 210px; height: 315px; }
    input { height: 76px; }
    button { height: 82px; }
    .field { margin-bottom: 38px; }
  }
</style>
</head>

<body>
  <main class="page">
    <h1>Login to Continue</h1>

    <section class="card">
      <img class="logo" src="https://adxpanel.github.io/login/adxpanel-logo.png" alt="ADXPanel Logo">

      <form id="loginForm">
        <div class="field">
          <label for="username">USERNAME OR EMAIL</label>
          <input id="username" name="username" type="text" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="password">PASSWORD</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <button type="submit">LOGIN</button>
      </form>

      <a class="forgot" href="#" id="forgot">FORGOT PASSWORD?</a>
    </section>

    <footer>© 2015 - 2023 ADX Software</footer>
  </main>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  console.log("Login:", { username, password });
});

document.getElementById("forgot").addEventListener("click", function(e) {
  e.preventDefault();
  alert("Forgot password");
});
</script>
</body>
</html>
